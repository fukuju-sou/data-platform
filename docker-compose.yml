services:

  # ============================================================
  # Spark Master
  # ============================================================
  spark-master:
    image: apache/spark:3.5.6
    container_name: data-platform-spark-master
    hostname: spark-master

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "7077:7077"
      - "8080:8080"


  # ============================================================
  # Spark Worker 1
  # ============================================================
  spark-worker-1:
    image: apache/spark:3.5.6
    container_name: data-platform-spark-worker-1
    hostname: spark-worker-1

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --cores 2
      --memory 2G
      spark://spark-master:7077

    depends_on:
      - spark-master

    ports:
      - "8081:8081"

    volumes:
      - ./raw:/opt/data/raw:ro


  # ============================================================
  # Spark Worker 2
  # ============================================================
  spark-worker-2:
    image: apache/spark:3.5.6
    container_name: data-platform-spark-worker-2
    hostname: spark-worker-2

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --cores 2
      --memory 2G
      spark://spark-master:7077

    depends_on:
      - spark-master

    ports:
      - "8082:8081"

    volumes:
      - ./raw:/opt/data/raw:ro


  # ============================================================
  # Spark Driver
  # ============================================================
  spark-driver:
    build:
      context: ./spark
      dockerfile: Dockerfile

    container_name: data-platform-spark-driver
    hostname: spark-driver

    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
      - clickhouse

    volumes:
      - ./raw:/opt/data/raw:ro
      - ./spark/sales-processing/target/scala-2.12:/opt/spark-apps:ro

    ports:
      - "4040:4040"

    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --class com.example.SalesProcessor
      --conf spark.driver.host=spark-driver
      --conf spark.driver.bindAddress=0.0.0.0
      --conf spark.ui.port=4040
      /opt/spark-apps/sales-processing_2.12-1.0.0.jar


  # ============================================================
  # ClickHouse
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: data-platform-clickhouse

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: data_platform
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    restart: unless-stopped


volumes:
  clickhouse-data:
  clickhouse-logs: